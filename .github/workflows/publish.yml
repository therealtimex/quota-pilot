name: Publish to npm

# Publishing here makes `npx quota-pilot` resolve to this package on the
# public npm registry — npx itself needs no separate setup, it just fetches
# whatever version is published.
#
# Trigger by pushing a version tag that matches the version in package.json:
#   npm version patch   # bumps package.json + creates a matching git tag
#   git push --follow-tags
#
# Or run it manually from the Actions tab (workflow_dispatch) for a one-off
# republish of the current package.json version.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
